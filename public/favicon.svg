<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)" opacity="0.1"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  
  <!-- Sparkle/Lamp icon -->
  <g filter="url(#glow)">
    <!-- Genie lamp body -->
    <path d="M30 55 Q30 35 50 30 Q70 35 70 55 Q70 70 50 75 Q30 70 30 55" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Lamp spout -->
    <path d="M70 55 Q78 50 82 45" fill="none" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Lamp handle -->
    <path d="M30 58 Q22 60 22 68 Q22 75 30 73" fill="none" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Top opening glow -->
    <ellipse cx="50" cy="32" rx="12" ry="6" fill="url(#grad)" opacity="0.4"/>
    
    <!-- Magic sparkles -->
    <circle cx="35" cy="25" r="2" fill="#22d3ee">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="65" cy="28" r="1.5" fill="#a855f7">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="22" r="1" fill="#fff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
